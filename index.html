<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نامەیەکی شاراوە 💌</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            padding: 20px;
            color: #4a4a4a;
        }

        /* کاشگێڕ */
        .timer-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 15px;
            margin-bottom: 120px; /* بەهۆی ئەم دوورییە زۆرەوە نامەکە بە هیچ شێوەیەک ناگات بە کاشگێڕ */
            z-index: 100;
            position: relative;
        }

        .timer-title {
            font-size: 1rem;
            color: #e6005c;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .timer {
            display: flex;
            gap: 12px;
            justify-content: center;
            direction: ltr;
        }

        .time-box {
            background: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .time-box span {
            display: block;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff4d6d;
        }

        .time-box label {
            font-size: 0.7rem;
            color: #888;
        }

        /* زەرفی نامەکە */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            z-index: 10;
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #ff4d6d;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            position: relative;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .envelope:hover {
            transform: scale(1.03);
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            border-top: 100px solid #ff758f;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            transform-origin: top;
            transition: transform 0.5s ease 0.3s;
            z-index: 3;
        }

        .envelope.open::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* کاغذی ناو نامەکە */
        .letter {
            position: absolute;
            bottom: 0;
            left: 15px;
            width: 250px;
            height: 160px;
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: all 0.6s ease;
            z-index: 2;
            overflow: hidden;
            text-align: center;
        }

        /* بەرزیی ڕێکخراو لە کاتی بەرزبوونەوەدا */
        .envelope.open .letter {
            transform: translateY(-80px); 
            height: auto;
            min-height: 220px;
            z-index: 4;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .letter p {
            font-size: 0.88rem;
            line-height: 1.5;
            color: #333;
            margin-top: 8px;
        }

        .tap-hint {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #d63384;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* دڵەکان */
        .heart {
            position: fixed;
            font-size: 20px;
            color: #ff4d6d;
            animation: float 4s linear infinite;
            z-index: 1;
            bottom: -20px;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="timer-container">
        <div class="timer-title">ئەو کاتەی پێکەوەین ❤️</div>
        <div class="timer">
            <div class="time-box"><span id="days">0</span><label>Days</label></div>
            <div class="time-box"><span id="hours">0</span><label>Hours</label></div>
            <div class="time-box"><span id="minutes">0</span><label>Mins</label></div>
            <div class="time-box"><span id="seconds">0</span><label>Secs</label></div>
        </div>
    </div>

    <div class="envelope-wrapper" onclick="openEnvelope()">
        <div class="envelope" id="env">
            <div class="letter">
                <h3 style="color: #ff4d6d; font-size: 0.95rem;">بۆ خۆشەویستەکەم 💖</h3>
                <p>
                    Happy National Girlfriends Day! 🌸<br>
                    سوپاس بۆ ئەوەی هەمیشە جوانترین بەشی ژیانمی. تۆ تایبەترین دیاری خودایت بۆ من و بە بوونی تۆ هەموو ڕۆژێک ئاشقتر دەبم! ✨❤️
                </p>
            </div>
        </div>
    </div>

    <div class="tap-hint" id="hint">پەنجە لە زەرفەکە بدە بۆ کردنەوەی نامەکە 💌</div>

    <script>
        // بەرواری ناسین: 29 / 10 / 2025
        const startDate = new Date(2025, 9, 29); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        // کردنەوەی نامە
        function openEnvelope() {
            const env = document.getElementById('env');
            const hint = document.getElementById('hint');
            env.classList.toggle('open');
            if(env.classList.contains('open')) {
                hint.innerText = "❤️";
            } else {
                hint.innerText = "پەنجە لە زەرفەکە بدە بۆ کردنەوەی نامەکە 💌";
            }
        }

        // بارانی دڵ
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
